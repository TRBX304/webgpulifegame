<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Game of Life — WebGPU</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans JP",sans-serif}
    #root{display:flex;height:100%;gap:12px;padding:12px;box-sizing:border-box}
    canvas{border:1px solid #222;image-rendering:pixelated}
    .controls{width:320px}
    button,input{display:block;margin:8px 0;padding:8px;width:100%}
    label{font-size:13px;color:#ddd}
    .small{font-size:12px}
    body{background:#0b0b0b;color:#eee}
  </style>
</head>
<body>
<div id="root">
  <div>
    <canvas id="canvas"></canvas>
  </div>
  <div class="controls">
    <h3>Game of Life — WebGPU</h3>
    <label>Grid width: <input id="width" type="number" value="1254"/></label>
    <label>Grid height: <input id="height" type="number" value="706"/></label>
    <button id="applySize">Apply Size</button>

    <button id="start">Start</button>
    <button id="step">Step</button>
    <button id="random">Randomize</button>
    <button id="clear">Clear</button>

    <label>Speed (ms per step): <input id="speed" type="range" min="1" max="200" value="30"/></label>
    <div id="status" class="small">status: idle</div>

    <p class="small">Click canvas to toggle cells. Use Apply Size after changing resolution.</p>
    <p class="small">Works on browsers with WebGPU (Chrome/Edge recent). If WebGPU unavailable, open about:flags or use a WebGPU-enabled build.</p>
  </div>
</div>

<script type="module">
(async ()=>{
  if (!('gpu' in navigator)){
    alert('このブラウザは WebGPU をサポートしていません。Chrome/Edge の最新版をお試しください。');
    return;
  }

  // DOM
  const canvas = document.getElementById('canvas');
  const startBtn = document.getElementById('start');
  const stepBtn = document.getElementById('step');
  const randomBtn = document.getElementById('random');
  const clearBtn = document.getElementById('clear');
  const speedRange = document.getElementById('speed');
  const status = document.getElementById('status');
  const widthInput = document.getElementById('width');
  const heightInput = document.getElementById('height');
  const applySize = document.getElementById('applySize');

  let gridWidth = parseInt(widthInput.value,10);
  let gridHeight = parseInt(heightInput.value,10);

  // WebGPU device
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const queue = device.queue;

  // Shaders (WGSL)
  const computeShaderWGSL = `
struct Params { width : u32; height : u32; };
@group(0) @binding(0) var inputTex : texture_2d<f32>;
@group(0) @binding(1) var outputTex : texture_storage_2d<rgba8unorm, write>;
@group(0) @binding(2) var<uniform> params : Params;

@compute @workgroup_size(16,16)
fn main(@builtin(global_invocation_id) gid : vec3<u32>){
  let x = i32(gid.x);
  let y = i32(gid.y);
  let w = i32(params.width);
  let h = i32(params.height);
  if (x >= w || y >= h) { return; }
  var count : i32 = 0;
  for (var oy = -1; oy <= 1; oy = oy + 1) {
    for (var ox = -1; ox <= 1; ox = ox + 1) {
      if (ox == 0 && oy == 0) { continue; }
      let nx = (x + ox + w) % w;
      let ny = (y + oy + h) % h;
      let c : f32 = textureLoad(inputTex, vec2<i32>(nx, ny), 0).r;
      if (c > 0.5) { count = count + 1; }
    }
  }
  let cur : f32 = textureLoad(inputTex, vec2<i32>(x, y), 0).r;
  var out : f32 = 0.0;
  if (cur > 0.5) {
    if (count == 2 || count == 3) { out = 1.0; }
  } else {
    if (count == 3) { out = 1.0; }
  }
  textureStore(outputTex, vec2<i32>(x, y), vec4<f32>(out, out, out, 1.0));
}
`;

  const vertWGSL = `
@vertex
fn vs_main(@builtin(vertex_index) vi : u32) -> @builtin(position) vec4<f32> {
  // full-screen triangle
  var pos = array<vec2<f32>, 3>(
    vec2<f32>(-1.0, -1.0),
    vec2<f32>(3.0, -1.0),
    vec2<f32>(-1.0, 3.0)
  );
  return vec4<f32>(pos[vi], 0.0, 1.0);
}
`;

  const fragWGSL = `
@group(0) @binding(0) var mySampler : sampler;
@group(0) @binding(1) var myTexture : texture_2d<f32>;

@fragment
fn fs_main(@builtin(position) fragCoord : vec4<f32>) -> @location(0) vec4<f32> {
  // fragCoord.xy is in pixels of render target; convert to uv
  let dims = vec2<f32>(textureDimensions(myTexture, 0));
  let uv = fragCoord.xy / dims;
  let col = textureSampleLevel(myTexture, mySampler, uv, 0.0);
  return vec4<f32>(col.rgb, 1.0);
}
`;

  // GPU pipelines
  const computeModule = device.createShaderModule({code: computeShaderWGSL});
  const computePipeline = device.createComputePipeline({
    layout: 'auto',
    compute: { module: computeModule, entryPoint: 'main' }
  });

  const renderModule = device.createShaderModule({code: vertWGSL + '\n' + fragWGSL});
  const renderPipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: device.createShaderModule({code: vertWGSL}), entryPoint: 'vs_main' },
    fragment: { module: device.createShaderModule({code: fragWGSL}), entryPoint: 'fs_main', targets: [{format: navigator.gpu.getPreferredCanvasFormat()}] },
    primitive: { topology: 'triangle-list' }
  });

  // state
  let texA, texB; // ping-pong textures
  let bindGroupA, bindGroupB; // A: input=texA, output=texB ; B: input=texB, output=texA
  let paramsBuffer;
  let sampler;
  let canvasFormat = navigator.gpu.getPreferredCanvasFormat();

  let grid = null; // Uint8Array RGBA
  let running = false;
  let interval = parseInt(speedRange.value,10);
  let lastStepTime = 0;

  function resizeCanvasForGrid(){
    canvas.width = gridWidth;
    canvas.height = gridHeight;
    canvas.style.width = (Math.min(900, gridWidth)) + 'px';
    canvas.style.height = Math.round(gridHeight * (parseInt(canvas.style.width)/gridWidth)) + 'px';
    // configure canvas context
    const ctx = canvas.getContext('webgpu');
    ctx.configure({ device, format: canvasFormat, alphaMode: 'opaque' });
  }

  function makeEmptyGrid(){
    grid = new Uint8Array(gridWidth * gridHeight * 4);
    // all zeros (dead)
  }

  function randomizeGrid(){
    for (let y=0;y<gridHeight;y++){
      for (let x=0;x<gridWidth;x++){
        const v = (Math.random() < 0.15) ? 255 : 0;
        const idx = (y*gridWidth + x)*4;
        grid[idx] = v; grid[idx+1]=v; grid[idx+2]=v; grid[idx+3]=255;
      }
    }
  }

  function uploadGridToTexture(tex){
    queue.writeTexture(
      { texture: tex },
      grid,
      { bytesPerRow: gridWidth * 4 },
      { width: gridWidth, height: gridHeight, depthOrArrayLayers: 1 }
    );
  }

  function createTexturesAndBindGroups(){
    // destroy previous textures? LET GC handle it.
    texA = device.createTexture({ size: [gridWidth, gridHeight], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT });
    texB = device.createTexture({ size: [gridWidth, gridHeight], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT });

    // sampler for render
    sampler = device.createSampler({ magFilter: 'nearest', minFilter: 'nearest' });

    // params uniform
    const paramArray = new Uint32Array([gridWidth, gridHeight]);
    paramsBuffer = device.createBuffer({ size: 8, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(paramsBuffer, 0, paramArray.buffer, paramArray.byteOffset, paramArray.byteLength);

    // bind groups
    bindGroupA = device.createBindGroup({ layout: computePipeline.getBindGroupLayout(0), entries: [
      { binding: 0, resource: texA.createView() },
      { binding: 1, resource: texB.createView() },
      { binding: 2, resource: { buffer: paramsBuffer } }
    ]});

    bindGroupB = device.createBindGroup({ layout: computePipeline.getBindGroupLayout(0), entries: [
      { binding: 0, resource: texB.createView() },
      { binding: 1, resource: texA.createView() },
      { binding: 2, resource: { buffer: paramsBuffer } }
    ]});

    // render bind group (for fragment) - layout 0 used by render's group 0
    // create a separate layout by fetching it from renderPipeline
    const renderBindGroupLayout = renderPipeline.getBindGroupLayout(0);
    renderBindGroup = device.createBindGroup({ layout: renderBindGroupLayout, entries: [
      { binding: 0, resource: sampler },
      { binding: 1, resource: texA.createView() }
    ]});
  }

  // initial setup
  makeEmptyGrid();
  randomizeGrid();
  resizeCanvasForGrid();
  createTexturesAndBindGroups();
  uploadGridToTexture(texA);

  // handle resize / apply size
  applySize.addEventListener('click', ()=>{
    gridWidth = Math.max(8, Math.min(2048, parseInt(widthInput.value,10) || 128));
    gridHeight = Math.max(8, Math.min(2048, parseInt(heightInput.value,10) || 128));
    makeEmptyGrid();
    randomizeGrid();
    resizeCanvasForGrid();
    createTexturesAndBindGroups();
    uploadGridToTexture(texA);
    status.textContent = 'size applied';
  });

  // mouse toggling
  let isDown = false;
  canvas.addEventListener('pointerdown', (e)=>{
    isDown = true; toggleAt(e);
  });
  window.addEventListener('pointerup', ()=>{ isDown = false; });
  canvas.addEventListener('pointermove', (e)=>{ if(isDown) toggleAt(e); });

  function toggleAt(e){
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const gx = Math.floor(cx * scaleX);
    const gy = Math.floor(cy * scaleY);
    if(gx < 0 || gx >= gridWidth || gy < 0 || gy >= gridHeight) return;
    const idx = (gy*gridWidth + gx)*4;
    const cur = grid[idx] > 0 ? 0 : 255;
    grid[idx] = grid[idx+1] = grid[idx+2] = cur;
    grid[idx+3] = 255;
    // upload single pixel
    const pixel = new Uint8Array([grid[idx], grid[idx+1], grid[idx+2], 255]);
    device.queue.writeTexture({ texture: texA, origin: {x: gx, y: gy, z: 0} }, pixel, {bytesPerRow: 4}, {width:1,height:1,depthOrArrayLayers:1});
  }

  // controls
  startBtn.addEventListener('click', ()=>{ running = !running; startBtn.textContent = running ? 'Stop' : 'Start'; });
  randomBtn.addEventListener('click', ()=>{ randomizeGrid(); uploadGridToTexture(texA); status.textContent = 'randomized'; });
  clearBtn.addEventListener('click', ()=>{ makeEmptyGrid(); uploadGridToTexture(texA); status.textContent = 'cleared'; });
  stepBtn.addEventListener('click', async ()=>{ await stepOnce(); render(); status.textContent = 'one step'; });
  speedRange.addEventListener('input', ()=>{ interval = parseInt(speedRange.value,10); status.textContent = `speed ${interval}ms`; });

  // ping-pong flag
  let ping = true;

  async function stepOnce(){
    // compute pass: read from texA (or texB) and write to texB (or texA)
    const commandEncoder = device.createCommandEncoder();
    const pass = commandEncoder.beginComputePass();
    pass.setPipeline(computePipeline);
    if (ping) {
      pass.setBindGroup(0, bindGroupA);
    } else {
      pass.setBindGroup(0, bindGroupB);
    }
    const workgroupX = Math.ceil(gridWidth / 16);
    const workgroupY = Math.ceil(gridHeight / 16);
    pass.dispatchWorkgroups(workgroupX, workgroupY);
    pass.end();
    device.queue.submit([commandEncoder.finish()]);
    // swap
    ping = !ping;
    // update render bind group to sample the newly produced texture (texB if ping false)
    const viewForRender = ping ? texA.createView() : texB.createView();
    renderBindGroup = device.createBindGroup({ layout: renderPipeline.getBindGroupLayout(0), entries: [ {binding:0, resource: sampler}, {binding:1, resource: viewForRender} ] });
    // copy latest texture into texA/storage for user edits: we keep ping semantics where texA is input for interactions
    // We will not copy back automatically to avoid overhead; instead we keep user edits in texA and reupload when needed.
  }

  function render(){
    const ctx = canvas.getContext('webgpu');
    const commandEncoder = device.createCommandEncoder();
    const textureView = ctx.getCurrentTexture().createView();
    const rpass = commandEncoder.beginRenderPass({ colorAttachments: [{ view: textureView, clearValue: {r:0, g:0, b:0, a:1}, loadOp: 'clear', storeOp: 'store' }] });
    rpass.setPipeline(renderPipeline);
    rpass.setBindGroup(0, renderBindGroup);
    rpass.draw(3,1,0,0);
    rpass.end();
    device.queue.submit([commandEncoder.finish()]);
  }

  // main loop
  function frame(t){
    if (running && t - lastStepTime >= interval){
      lastStepTime = t;
      stepOnce().then(()=>render());
    } else {
      render();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
